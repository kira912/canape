services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: canape
      POSTGRES_PASSWORD: canape
      POSTGRES_DB: canape
    ports:
      # 5432 is taken by orbit's database.
      - "5434:5432"
    volumes:
      - canape-postgres-data:/var/lib/postgresql/data

volumes:
  canape-postgres-data:
