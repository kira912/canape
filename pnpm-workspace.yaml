packages:
  - "apps/*"
  - "packages/*"
# Metro/Expo requires the hoisted linker to resolve native deps correctly.
nodeLinker: hoisted
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@nestjs/core': true
  esbuild: true
minimumReleaseAgeExclude:
  - expo-constants@57.0.20
  - expo-modules-core@57.0.20
  - expo@57.0.26
